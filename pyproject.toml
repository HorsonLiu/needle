[project]
name = "needle"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "flax",
    "optax",
    "datasets",
    "huggingface_hub",
    "sentencepiece",
    "tqdm",
]

[project.optional-dependencies]
tpu = ["jax[tpu]"]
gpu = ["jax[cuda12]"]
train = ["wandb"]
cloud = ["gcsfs"]

[project.scripts]
needle = "needle.cli:main"

[tool.setuptools.packages.find]
include = ["needle*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
